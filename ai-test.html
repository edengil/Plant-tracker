<!DOCTYPE html>
<html lang="he"><head><meta charset="utf-8"><title>AI diagnostic</title>
<script type="importmap">
{ "imports": {
  "firebase-app": "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js",
  "firebase-ai": "https://www.gstatic.com/firebasejs/13.1.0/firebase-ai.js",
  "firebase-remote-config": "https://www.gstatic.com/firebasejs/13.1.0/firebase-remote-config.js"
} }
</script>
<script src="https://www.gstatic.com/firebasejs/13.1.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/13.1.0/firebase-app-check-compat.js"></script>
</head>
<body>
<p id="status">running…</p>
<pre id="result">pending</pre>
<script>
var FIREBASE_CONFIG = {
  apiKey: "AIzaSyCFUS5Kk9FgyVEzzCqXoEAY5kY8EW-hFxM",
  authDomain: "plant-tracker-85766.firebaseapp.com",
  projectId: "plant-tracker-85766",
  storageBucket: "plant-tracker-85766.firebasestorage.app",
  messagingSenderId: "740967243913",
  appId: "1:740967243913:web:822f8b5590357c36c26658"
};
var appCheckState = 'not-run';
try{
  firebase.initializeApp(FIREBASE_CONFIG);
  firebase.appCheck().activate(new firebase.appCheck.ReCaptchaEnterpriseProvider("6LdKtOQtAAAAAGnRSXMd1lRtHev0z_exeTrROtpU"), true);
  appCheckState = 'activated';
}catch(e){ appCheckState = 'ACTIVATE-ERROR: ' + ((e && e.message) || e); }
</script>
<script type="module">
import { getApp } from 'firebase-app';
import { getAI, getGenerativeModel, GoogleAIBackend } from 'firebase-ai';
const status = document.getElementById('status');
const result = document.getElementById('result');
const lines = ['appCheck: ' + window.appCheckState];
try{
  const resp = await fetch('img/plants/basil.jpg');
  const blob = await resp.blob();
  const dataURL = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(blob); });
  const base64 = dataURL.split(',')[1];
  const ai = getAI(getApp(), { backend: new GoogleAIBackend() });
  const prompt = 'זהה את הצמח בתמונה. החזר JSON בלבד במבנה {"name": "שם בעברית", "scientific": "שם מדעי"}';
  for(const name of ['gemini-3.8-flash', 'gemini-3.5-flash-lite', 'gemini-2.5-flash']){
    try{
      const model = getGenerativeModel(ai, { model: name });
      const res = await model.generateContent([{ text: prompt }, { inlineData: { mimeType: 'image/jpeg', data: base64 } }]);
      lines.push(name + ' => OK: ' + res.response.text().slice(0, 200));
    }catch(e){
      lines.push(name + ' => ERROR: ' + ((e && (e.code || '') + ' ' + (e.message || '')) || e).slice(0, 300));
    }
  }
}catch(e){
  lines.push('SETUP-ERROR: ' + ((e && e.message) || e));
}
result.textContent = lines.join('\n');
status.textContent = 'done';
</script>
</body></html>
